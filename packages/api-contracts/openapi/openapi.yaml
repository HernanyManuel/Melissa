components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: melissa_refresh
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    TenantSelector:
      name: X-Tenant-Id
      in: header
      required: true
      description: Seletor; exige membership ativa validada no backend.
      schema: *id001
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag da versão atual, por exemplo "3".
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  field:
                    type: string
                  code:
                    type: string
                required:
                - field
                - code
          required:
          - code
          - message
          - request_id
      required:
      - error
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        email: &id002
          type: string
          format: email
          maxLength: 254
        name: &id003
          type: string
          minLength: 1
          maxLength: 120
        locale: &id004
          type: string
          enum:
          - pt
          - en
          - es
          - fr
          - de
          - it
        email_verified:
          type: boolean
      required:
      - id
      - email
      - name
      - locale
      - email_verified
    RegisterInput:
      type: object
      additionalProperties: false
      properties:
        email: *id002
        name: *id003
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
          writeOnly: true
        locale: *id004
        terms_version: *id003
        privacy_version: *id003
      required:
      - email
      - name
      - password
      - locale
      - terms_version
      - privacy_version
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        email: *id002
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
          writeOnly: true
      required:
      - email
      - password
    AuthSession:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          minimum: 1
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - token_type
      - expires_in
      - user
    EmailInput:
      type: object
      additionalProperties: false
      properties:
        email: *id002
      required:
      - email
    ResetInput:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 512
          writeOnly: true
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
          writeOnly: true
      required:
      - token
      - password
    TenantInput:
      type: object
      additionalProperties: false
      properties:
        name: *id003
        country_code:
          type: string
          pattern: ^[A-Z]{2}$
        timezone: *id005
        default_language: *id004
        default_currency: &id006
          type: string
          pattern: ^[A-Z]{3}$
      required:
      - name
      - country_code
      - timezone
      - default_language
      - default_currency
    TenantPatch:
      type: object
      additionalProperties: false
      properties:
        name: *id003
        city: *id003
        website_url:
          type: string
          format: uri
          maxLength: 2048
      minProperties: 1
    Tenant:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name: *id003
        country_code:
          type: string
          pattern: ^[A-Z]{2}$
        timezone: *id005
        default_language: *id004
        default_currency: *id006
        operational_status:
          type: string
          enum:
          - active
          - restricted
          - suspended
          - cancelled
        provisioning_status:
          type: string
          enum:
          - draft
          - configuring
          - waiting_channel
          - waiting_calendar
          - waiting_payment
          - ready_for_test
          - testing
          - active
          - needs_review
          - suspended
          - cancelled
        version:
          type: integer
          minimum: 1
      required:
      - id
      - name
      - country_code
      - timezone
      - default_language
