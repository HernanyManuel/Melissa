name: Format calendar files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-5-ai-engine
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write apps/backend/src/calendar/booking-calendar-dispatch-store.ts apps/backend/src/calendar/booking-calendar-processor.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/src/calendar/booking-calendar-dispatch-store.ts apps/backend/src/calendar/booking-calendar-processor.ts
          git commit -m "style(calendar): apply canonical prettier output"
          git push origin HEAD:feature/phase-5-ai-engine
