name: Melissa checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: melissa
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: melissa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U melissa -d melissa_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      MIGRATION_DATABASE_URL: postgresql://melissa:ci-disposable-only@localhost:5432/melissa_test?connection_limit=5&connect_timeout=3
      DATABASE_URL: postgresql://melissa_runtime:ci-runtime-only@localhost:5432/melissa_test?connection_limit=5&connect_timeout=3
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Diagnose AI turn processor formatting
        run: |
          pnpm exec prettier --write apps/backend/src/ai/ai-turn-processor.ts apps/backend/test/ai-turn-processor.test.ts
          git diff -- apps/backend/src/ai/ai-turn-processor.ts apps/backend/test/ai-turn-processor.test.ts
          exit 1
