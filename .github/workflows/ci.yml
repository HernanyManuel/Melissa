name: Melissa checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: melissa
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: melissa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U melissa -d melissa_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      MIGRATION_DATABASE_URL: postgresql://melissa:ci-disposable-only@localhost:5432/melissa_test?connection_limit=5&connect_timeout=3
      DATABASE_URL: postgresql://melissa_runtime:ci-runtime-only@localhost:5432/melissa_test?connection_limit=5&connect_timeout=3
      BILLING_INVOICE_VERIFIER_DATABASE_URL: postgresql://melissa_billing_invoice_verifier:ci-invoice-only@localhost:5432/melissa_test?connection_limit=5&connect_timeout=3
      BILLING_DISPATCHER_DATABASE_URL: postgresql://melissa_billing_dispatcher:ci-dispatch-only@localhost:5432/melissa_test?connection_limit=5&connect_timeout=3
      BILLING_LINKER_DATABASE_URL: postgresql://melissa_billing_linker:ci-linker-only@localhost:5432/melissa_test?connection_limit=5&connect_timeout=3
      BILLING_RECONCILER_DATABASE_URL: postgresql://melissa_billing_reconciler:ci-billing-only@localhost:5432/melissa_test?connection_limit=5&connect_timeout=3
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Verify package manager version
        run: test "$(pnpm --version)" = "11.25.0"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Provision non-owner application role and migrate
        run: |
          RUNTIME_PASSWORD=ci-runtime-only psql "${MIGRATION_DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -v runtime_password=ci-runtime-only -f infra/scripts/runtime-role.sql
          DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm db:migrate
          psql "${MIGRATION_DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -v reconciler_password=ci-billing-only -f infra/scripts/billing-reconciler-login.sql
      - name: Provision test-only restricted billing linker
        run: psql "${MIGRATION_DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -v linker_password=ci-linker-only -f infra/scripts/billing-linker-login.sql
      - name: Provision test-only restricted billing dispatcher
        run: psql "${MIGRATION_DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -v dispatcher_password=ci-dispatch-only -f infra/scripts/billing-dispatcher-login.sql
      - name: Provision test-only restricted invoice verifier
        run: psql "${MIGRATION_DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -v invoice_verifier_password=ci-invoice-only -f infra/scripts/billing-invoice-verifier-login.sql
      - name: Verify idempotent development seed
        run: |
          DEMO_PASSWORD=ci-demo-password-only pnpm db:seed
          DEMO_PASSWORD=ci-demo-password-only pnpm db:seed
      - name: Seed small synthetic analytics dataset in disposable CI PostgreSQL
        run: |
          mkdir -p .ci-artifacts
          NODE_ENV=test P10_SYNTHETIC_LOAD=YES P10_SYNTHETIC_SIZE=small \
            pnpm --filter @melissa/backend exec tsx scripts/seed-analytics-benchmark.ts \
            | tee .ci-artifacts/analytics-seed-output.txt
      - name: Validate analytics benchmark SQL under tenant RLS
        run: |
          tenant_id="$(grep -oE 'P10 synthetic 0: tenant=[0-9a-f-]+' .ci-artifacts/analytics-seed-output.txt | head -n 1 | cut -d= -f2)"
          test "${#tenant_id}" -eq 36
          psql "${DATABASE_URL%%\?*}" -X -v ON_ERROR_STOP=1 \
            -v tenant_id="$tenant_id" -v expect_small=1 \
            -f docs/analytics-summary-benchmark.sql > .ci-artifacts/analytics-sql-plan.txt
          test "$(grep -c 'Execution Time:' .ci-artifacts/analytics-sql-plan.txt)" -eq 3
          grep -q 'melissa_runtime' .ci-artifacts/analytics-sql-plan.txt
          # Independently validate the second seeded tenant and reject duplicate IDs.
          tenant_b="$(grep -oE 'P10 synthetic 1: tenant=[0-9a-f-]+' .ci-artifacts/analytics-seed-output.txt | head -n 1 | cut -d= -f2)"
          test "${#tenant_b}" -eq 36
          test "$tenant_id" != "$tenant_b"
          psql "${DATABASE_URL%%\?*}" -X -v ON_ERROR_STOP=1 \
            -v tenant_id="$tenant_b" -v expect_small=1 \
            -f docs/analytics-summary-benchmark.sql > .ci-artifacts/analytics-sql-plan-tenant-b.txt
          test "$(grep -c 'Execution Time:' .ci-artifacts/analytics-sql-plan-tenant-b.txt)" -eq 3
          grep -q 'melissa_runtime' .ci-artifacts/analytics-sql-plan-tenant-b.txt
          # Second observation for each tenant; CI remains a smoke test, not a latency SLA.
          for label in a b; do
            if [ "$label" = a ]; then
              scoped_tenant="$tenant_id"
            else
              scoped_tenant="$tenant_b"
            fi
            output=".ci-artifacts/analytics-sql-plan-tenant-${label}-repeat.txt"
            psql "${DATABASE_URL%%\?*}" -X -v ON_ERROR_STOP=1 \
              -v tenant_id="$scoped_tenant" -v expect_small=1 \
              -f docs/analytics-summary-benchmark.sql > "$output"
            test "$(grep -c 'Execution Time:' "$output")" -eq 3
            grep -q 'melissa_runtime' "$output"
          done
      - name: Validate reusable synthetic volume guard (positive and negative cases)
        run: |
          for index in 0 1; do
            tenant_id="$(grep -oE "P10 synthetic ${index}: tenant=[0-9a-f-]+" .ci-artifacts/analytics-seed-output.txt | head -n 1 | cut -d= -f2)"
            test "${#tenant_id}" -eq 36
            psql "${DATABASE_URL%%\?*}" -X -v ON_ERROR_STOP=1 -qAt \
              -v tenant_id="$tenant_id" \
              -v expected_conversations=100 -v expected_turns=300 -v expected_audits=300 \
              -f docs/analytics-summary-assert-synthetic.sql > /dev/null
          done
          tenant_id="$(grep -oE 'P10 synthetic 0: tenant=[0-9a-f-]+' .ci-artifacts/analytics-seed-output.txt | head -n 1 | cut -d= -f2)"
          if psql "${DATABASE_URL%%\?*}" -X -v ON_ERROR_STOP=1 -qAt \
              -v tenant_id="$tenant_id" \
              -v expected_conversations=101 -v expected_turns=300 -v expected_audits=300 \
              -f docs/analytics-summary-assert-synthetic.sql > /dev/null 2> .ci-artifacts/expected-assert-failure.txt; then
            echo "Expected volume guard to reject an incorrect conversation count"
            exit 1
          fi
          grep -q 'division by zero' .ci-artifacts/expected-assert-failure.txt
      - name: Upload analytics SQL plans for both tenants (CI smoke, not performance baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-sql-plan-smoke
          path: |
            .ci-artifacts/analytics-sql-plan.txt
            .ci-artifacts/analytics-sql-plan-tenant-b.txt
            .ci-artifacts/analytics-sql-plan-tenant-a-repeat.txt
            .ci-artifacts/analytics-sql-plan-tenant-b-repeat.txt
          if-no-files-found: ignore
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Integration with a separate real worker process
        run: |
          node apps/backend/dist/src/worker.js &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; wait "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3001/health/ready
          pnpm test:integration
      - name: Worker restart and Redis transport recovery
        run: RUN_WORKER_RESTART_TEST=true node --test apps/backend/dist/test/worker-restart.integration.test.js
      - run: pnpm openapi
      - uses: actions/upload-artifact@v4
        with:
          name: backend-bootstrap-artifacts
          path: |
            pnpm-lock.yaml
            packages/api-contracts/generated/infrastructure.openapi.json
      - name: Test audit connectivity diagnostics
        run: node --test infra/scripts/audit-connectivity.test.mjs
      - name: Diagnose npm connectivity (not a vulnerability scan)
        run: node infra/scripts/audit-connectivity.mjs --run
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --dart-define=API_BASE_URL=http://localhost:3000
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-bootstrap-artifacts
          path: |
            apps/flutter_app/pubspec.lock
            apps/flutter_app/build/web
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: curl --fail http://localhost:3000/health/ready
      - if: always()
        run: docker compose down --volumes
